[project]
name = "squad-backend"
version = "1.0.0"
description = "sqUAd: party games for your squad. FastAPI backend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "mangum>=0.19.0",
    "pyjwt[crypto]>=2.9.0",
    # boto3 is already inside the AWS Lambda Python runtime; it is listed here
    # for local runs and tests, and left out of the Lambda zip (see Makefile).
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "moto[dynamodb]>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends()/Header() in defaults is the framework's documented style.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
